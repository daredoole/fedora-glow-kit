name: Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-audit:
    name: Public audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep

      - name: Run public audit
        run: bash scripts/audit-public.sh

  formatting:
    name: Formatting and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install shfmt and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt golang-go
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Check shell formatting
        run: shfmt -d .

      - name: Check GitHub Actions
        run: actionlint

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint "**/*.md" --ignore "configs/kde/themes/**"

  fedora-smoke-test:
    name: Fedora dry-run smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:latest
    steps:
      - name: Install git and audit tools
        run: dnf install -y git bash findutils grep ripgrep ShellCheck || dnf install -y git bash findutils grep ripgrep shellcheck

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
